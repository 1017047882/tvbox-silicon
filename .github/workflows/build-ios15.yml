name: iPhone iOS 15 IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Inspect sources and Apple toolchain (no IPA)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Record Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            git rev-parse HEAD
            uname -m
            xcodebuild -version
            xcrun swift --version
            xcrun --sdk iphoneos --show-sdk-version
          } 2>&1 | tee artifacts/toolchain.txt

      - name: Inspect iOS 15 migration requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re

          root = pathlib.Path.cwd()
          lines = ["# iOS 15 compatibility preflight", "",
                   "This workflow inventories migration requirements; it does not compile or produce an IPA.",
                   "", "## Deployment settings"]
          checks = {
              "project.yml": r"iOS:\s*['\"]([0-9.]+)",
              "Package.swift": r"\.iOS\(\.v(\d+)\)",
          }
          for name, pattern in checks.items():
              match = re.search(pattern, (root / name).read_text())
              version = match.group(1) if match else "unknown"
              lines.append(f"- {name}: iOS {version}")

          lines.extend(["", "## Shared package symlinks"])
          for name in ["Package.swift", "Sources", "Vendor", "Tests/TVCoreTests"]:
              path = root / "Packages/TVCore" / name
              status = "OK" if path.is_symlink() and path.exists() else "CHECK REQUIRED"
              lines.append(f"- Packages/TVCore/{name}: {status}")

          patterns = {
              "Observation declarations (iOS 17+)": r"@Observable\b",
              "Navigation APIs (iOS 16+)": r"\b(?:NavigationStack|NavigationSplitView|NavigationPath)\b",
              "Presentation APIs (iOS 17+)": r"\b(?:ContentUnavailableView|scrollPosition|sensoryFeedback|symbolEffect)\b",
              "iOS 27 API references requiring SDK review": r"iOS 27|UISceneAccessoryRegistration|registerSceneAccessory",
              "Native iOS 17 build settings": r"ios17\.0|miphoneos-version-min=17\.0|MINIMUM_OS=17\.0|IPHONEOS_DEPLOYMENT_TARGET=17\.0",
          }
          files = sorted({p for folder in ["App", "Sources", "Scripts"]
                          for p in (root / folder).rglob("*")
                          if p.is_file() and p.suffix in {".swift", ".sh"}})
          for title, pattern in patterns.items():
              lines.extend(["", "## " + title])
              hits = []
              for path in files:
                  for number, line in enumerate(path.read_text(errors="replace").splitlines(), 1):
                      if re.search(pattern, line):
                          hits.append(f"- {path.relative_to(root).as_posix()}:{number}: `{line.strip()}`")
              lines.extend(hits or ["No textual matches; compiler and binary checks are still required."])

          lines.extend(["", "## Build gates",
                        "- Core and all App Swift sources must compile for the iOS 15 device target.",
                        "- The IPA job requires Java, Python and Node device runtimes.",
                        "- Archive only the iPhone target and inspect embedded Mach-O deployment requirements.",
                        "- Download the unsigned IPA from the separate package job's artifact.",
                        "- Sign and test on a physical iOS 15.5 device."])
          report = "\n".join(lines) + "\n"
          (root / "artifacts/ios15-report.md").write_text(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(report)
          print(report)
          PY

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios15-preflight-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  package-iphone:
    name: Build iPhone iOS 15 unsigned IPA
    needs: compile-core
    runs-on: macos-15
    timeout-minutes: 360
    env:
      JOBS: '3'
      TVBOX_FFMPEG_CACHE: ${{ github.workspace }}/build/ffmpeg-cache
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@v6

      - name: Record and require an arm64 toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(uname -m)" = arm64
          {
            git rev-parse HEAD
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
          } | tee artifacts/ipa-toolchain.txt
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config cmake maven xcodegen python@3.14
          echo "$(brew --prefix python@3.14)/libexec/bin" >> "$GITHUB_PATH"
          echo "HOST_PYTHON=$(brew --prefix python@3.14)/bin/python3.14" >> "$GITHUB_ENV"

      - name: Install host Java compiler
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Runtime/JavaHost/pom.xml

      - name: Install project generator dependency
        run: |
          python3 -m venv build/ipa-tools
          build/ipa-tools/bin/pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Check local build regressions
        run: python3 -m unittest discover -s Tests/BuildChecks -v

      - name: Restore complete device runtimes
        id: runtimes
        uses: actions/cache/restore@v4
        with:
          path: |
            build/AppleRuntime/iphoneos
            build/ApplePython/iphoneos
            build/NodeMobile
          key: iphone-ios15-arm64-v2-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Scripts/build-java-host.sh', 'Scripts/package-apple-runtime.sh', 'Scripts/build-apple-jvm.sh', 'Scripts/build-apple-libffi.sh', 'Scripts/build-apple-interpreter.sh', 'Scripts/build-apple-native-bindings.sh', 'Scripts/sync-apple-javahost.sh', 'Scripts/build-apple-python*.sh', 'Scripts/fetch-node-mobile.sh', 'Scripts/preserve-build-path.sh', 'Runtime/**', 'Config/Python/**', 'Config/iOS/**') }}

      - name: Build Java host and device JVM with native bindings
        if: steps.runtimes.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/build-java-host.sh 2>&1 | tee artifacts/java-host.log
          bash Scripts/package-apple-runtime.sh ios 2>&1 | tee artifacts/java-device.log

      - name: Build complete Python device runtime
        if: steps.runtimes.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/build-apple-python.sh ios 2>&1 | tee artifacts/python-device.log

      - name: Fetch verified Node device runtime
        if: steps.runtimes.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/fetch-node-mobile.sh 2>&1 | tee artifacts/node-device.log

      - name: Save complete device runtimes before app compilation
        if: steps.runtimes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/AppleRuntime/iphoneos
            build/ApplePython/iphoneos
            build/NodeMobile
          key: ${{ steps.runtimes.outputs.cache-primary-key }}

      - name: Restore compiled iPhone FFmpeg
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: build/ffmpeg-cache/*-ios/FFmpeg.xcframework
          key: iphone-ffmpeg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Scripts/build-apple-ffmpeg.sh') }}

      - name: Build FFmpeg for iPhone arm64 only
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/build-apple-ffmpeg.sh ios 2>&1 | tee artifacts/ipa-ffmpeg.log

      - name: Save compiled iPhone FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ffmpeg-cache/*-ios/FFmpeg.xcframework
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: Archive and package the iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/build/ipa-tools/bin:$PATH"
          bash Scripts/package-ios15-ipa.sh

      - name: Upload unsigned IPA and checksum
        uses: actions/upload-artifact@v6
        with:
          name: Yingxia-iPhone-iOS15-unsigned-${{ github.run_number }}
          path: |
            build/ios15-ipa/Yingxia-iPhone-iOS15-unsigned.ipa
            build/ios15-ipa/Yingxia-iPhone-iOS15-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload symbols for device crash diagnosis
        uses: actions/upload-artifact@v6
        with:
          name: iphone-crash-symbols-${{ github.sha }}
          path: build/ios15-ipa/TVBox-iOS.xcarchive/dSYMs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize IPA build
        if: always()
        env:
          IPA_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo '# iPhone iOS 15 IPA'
            echo "Result: $IPA_STATUS"
            echo 'Target: iPhone arm64, iOS 15.0 minimum (includes iOS 15.5).'
            echo 'Java, Python and Node runtimes are required. Check binary report for embedded deployment requirements.'
            echo 'The IPA is unsigned; sign it with your sideload tool before installation.'
            echo 'Successful packaging does not replace iOS 15.5 device testing.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and compatibility logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: iphone-ipa-logs-${{ github.run_number }}
          path: |
            artifacts/
            build/apple-runtime/**/config.log
            build/apple-python/**/*.log
          if-no-files-found: warn
          retention-days: 14

  compile-core:
    name: Build native prerequisites and compile iOS 15 core (no IPA)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TVBOX_FFMPEG_CACHE: ${{ github.workspace }}/build/ffmpeg-cache
      JOBS: '3'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Record toolchain and verify package symlinks
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            git rev-parse HEAD
            uname -m
            xcodebuild -version
            xcrun swift --version
            xcrun --sdk iphoneos --show-sdk-version
          } 2>&1 | tee artifacts/compiler-toolchain.txt
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          for link in Package.swift Sources Vendor Tests/TVCoreTests; do
            test -L "Packages/TVCore/$link"
            test -e "Packages/TVCore/$link"
          done
          test -L Vendor/FFmpeg/FFmpeg.xcframework

      - name: Verify preparation regression tests
        run: python3 -m unittest discover -s Tests/BuildChecks -v

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config

      - name: Build libffi for an iOS 15 device
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/build-apple-libffi.sh ios 2>&1 | tee artifacts/libffi-build.log
          xcrun ar -t build/apple-runtime/libffi-ios-3.4.8/install/lib/libffi.a > artifacts/libffi-members.txt

      - name: Restore compiled iPhone FFmpeg
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: build/ffmpeg-cache/*-ios/FFmpeg.xcframework
          key: iphone-ffmpeg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Scripts/build-apple-ffmpeg.sh') }}

      - name: Build FFmpeg for iPhone arm64 only
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/build-apple-ffmpeg.sh ios 2>&1 | tee artifacts/ffmpeg-build.log
          plutil -lint Vendor/FFmpeg/FFmpeg.xcframework/Info.plist

      - name: Save compiled iPhone FFmpeg before Swift compilation
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ffmpeg-cache/*-ios/FFmpeg.xcframework
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: Compile TVCore against the iOS 15 device target
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun swift build --target TVCore --configuration debug \
            --triple arm64-apple-ios15.0 --sdk "$SDK_PATH" \
            --scratch-path build/ios15-core --jobs 3 \
            -Xcc -Werror=unguarded-availability \
            2>&1 | tee artifacts/ios15-core-build.log

      - name: Compile all app Swift sources for iPhone iOS 15 (no linking or IPA)
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          LINK=Packages/IOS15AppCheck/App
          if [ -L "$LINK" ]; then
            test "$(readlink "$LINK")" = ../../App
          elif [ -e "$LINK" ]; then
            echo "Refusing to replace an unexpected app-check path: $LINK" >&2
            exit 1
          else
            ln -s ../../App "$LINK"
          fi
          xcrun swift build --package-path Packages/IOS15AppCheck \
            --target TVBoxIOS15Check --configuration debug \
            --triple arm64-apple-ios15.0 --sdk "$SDK_PATH" \
            --scratch-path build/ios15-app --jobs 3 \
            -Xcc -Werror=unguarded-availability \
            2>&1 | tee artifacts/ios15-app-build.log

      - name: Summarize the actual build status
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo '# iOS 15 build preparation'
            echo
            echo "Job status before this summary: $BUILD_STATUS"
            echo
            echo 'This job compiles TVCore and all app Swift sources for arm64-apple-ios15.0.'
            echo 'This source-check job does not link or package the app; the dependent iPhone IPA job does.'
            echo 'Both compiler steps must pass. Installation and iOS 15 device behavior still need validation.'
            echo
            echo '## Compiler diagnostics (first 80 unique source errors)'
            if [ -f artifacts/ios15-core-build.log ]; then
              python3 - <<'PY'
          import pathlib
          import re
          errors = []
          for name in ['ios15-core-build.log', 'ios15-app-build.log']:
              path = pathlib.Path('artifacts') / name
              if path.exists():
                  errors += [name + ': ' + line for line in path.read_text(errors='replace').splitlines()
                             if re.search(r':\d+:\d+: error:', line)]
          errors = list(dict.fromkeys(errors))
          print('```text')
          print('\n'.join(errors[:80]) or 'No error lines found; check the full log and step result.')
          print('```')
          if len(errors) > 80:
              print(f'{len(errors)} unique source errors; see full compiler logs for the remainder.')
          PY
            else
              echo 'The compiler step was not reached. Read libffi/FFmpeg logs and the failed step first.'
            fi
          } | tee artifacts/build-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload actual compiler and dependency logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios15-build-preparation-${{ github.run_number }}
          path: |
            artifacts/
            build/ffmpeg-cache/work.*/**/*.log
            build/apple-runtime/libffi-ios-3.4.8/config.log
          if-no-files-found: warn
          retention-days: 14
